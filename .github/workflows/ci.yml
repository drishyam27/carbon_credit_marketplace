name: CI — Carbon Credit Marketplace

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # ── Rust Smart Contract Tests ──────────────────────────────
  contract-tests:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/**/Cargo.lock', 'contract/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run cargo test
        run: cargo test --verbose

  # ── Frontend Tests ─────────────────────────────────────────
  frontend-tests:
    name: Frontend Vitest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm test
        run: npm test
